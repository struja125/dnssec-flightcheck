[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dnssec-flightcheck"
version = "0.1.0"
description = "Pre-flight simulator for DNSSEC key rollovers and DS changes"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "dnspython>=2.6",
    "cryptography>=42",
    "pyyaml>=6",
]

[project.optional-dependencies]
test = ["pytest>=8"]
real = ["zstandard>=0.22"]

[project.scripts]
flightcheck = "flightcheck.cli:main"

[tool.setuptools.packages.find]
include = ["flightcheck*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
