name: TTL trap avoided, waiting out the old TTL
description: >
  Same change as ttl-trap-bad, but signing switches only after the old 1-day DNSKEY TTL has
  expired; after that the new 5-minute TTL keeps the remaining steps short.
zone: bank.test.
start: 2026-11-02T12:00:00Z
delays:
  propagation: 5m
margin: 1h

keys:
  KSK1: {role: ksk, algorithm: ECDSAP256SHA256}
  ZSK1: {role: zsk, algorithm: ECDSAP256SHA256}
  ZSK2: {role: zsk, algorithm: ECDSAP256SHA256}

initial:
  ds:     {keys: [KSK1], ttl: 1d}
  dnskey: {keys: [KSK1, ZSK1], signed_by: [KSK1], ttl: 1d}
  data:
    www:  {signed_by: [ZSK1], ttl: 1h}

steps:
  - name: Lower the DNSKEY TTL to 5m and publish ZSK2
    at: 0h
    dnskey: {keys: [KSK1, ZSK1, ZSK2], ttl: 5m}
  - name: Sign with ZSK2
    at: 1d2h
    data:
      www: {signed_by: [ZSK2]}
  - name: Remove ZSK1
    at: 1d4h
    dnskey: {keys: [KSK1, ZSK2]}
