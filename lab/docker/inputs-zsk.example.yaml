# The operator's part of a ZSK rollover. Everything observed comes from the snapshot, so it is not repeated here.
replace: CHOOSE-A-KEY                   # `flightcheck plan` lists the zone's keys if this is not one of them
new_key: {algorithm: ECDSAP256SHA256}
start: START-TIME                       # for example 2026-11-02T12:00:00Z; not before the snapshot
delays: {propagation: 5m, registry: 1h, parent_propagation: 5m}
margin: 1h
resolver: {max_cache_ttl: 1d, profile: worst}
zone_ttl_bound: 1d                      # the longest TTL of any record the snapshot did not ask for
