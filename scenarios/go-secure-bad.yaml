name: Turning DNSSEC on, DS submitted together with signing
description: >
  The zone is signed and the DS is submitted in the same step through a fast registrar. Validators
  behind caches that still hold the unsigned DNSKEY answer or unsigned data see a secure
  delegation without matching keys or signatures.
zone: bank.test.
start: 2026-11-02T12:00:00Z
delays:
  propagation: 5m
  registry: 10m
margin: 1h

keys:
  KSK1: {role: ksk, algorithm: ECDSAP256SHA256}
  ZSK1: {role: zsk, algorithm: ECDSAP256SHA256}

initial:
  ds:     {keys: [], ttl: 1h}
  dnskey: {keys: [], signed_by: [], ttl: 1h}
  data:
    www:  {signed_by: [], ttl: 1h}

steps:
  - name: Sign the zone and submit the DS
    at: 0h
    dnskey: {keys: [KSK1, ZSK1], signed_by: [KSK1]}
    data:
      www: {signed_by: [ZSK1]}
    ds: {keys: [KSK1], ttl: 1d}
